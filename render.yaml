# Render Blueprint for ENTRACCESS UK Collector.
#
#   Render Dashboard -> New -> Blueprint -> this repository.
#
#   entraccess-collector-web  nginx: serves the built site on
#                             entraccess-collector.co.uk and proxies /api to
#                             the API over Render's private network. The only
#                             thing the internet reaches.
#   entraccess-collector-api  FastAPI, a private service with no public URL.
#   entraccess-collector-db   Render Postgres.
#
# Starter, not Free: free instances sleep after fifteen minutes, and a parent
# waiting at the door for a pass to check cannot wait for one to wake up.
#
# SECRET_KEY and PASS_SIGNING_KEY are generated by Render on the first deploy.
# Never regenerate PASS_SIGNING_KEY afterwards: it signs every collector's
# pass and derives their daily codes, so a new one stops every pass in
# circulation at once. Back it up somewhere other than Render.
#
# SMTP_PASSWORD (a Zoho app password for support@entraccess-collector.co.uk,
# never the login password) is typed into the dashboard by a person.
#
# The first ENTRACCESS UK operator is created from the API service's Shell:
#   python -m app.create_operator --email you@entraccess-collector.co.uk --name "Your Name"

services:
  - type: pserv
    name: entraccess-collector-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        value: https://entraccess-collector.co.uk
      - key: DATABASE_URL
        fromDatabase:
          name: entraccess-collector-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PASS_SIGNING_KEY
        generateValue: true
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_FROM
        value: ENTRACCESS UK Collector <support@entraccess-collector.co.uk>
      - key: SMTP_HOST
        value: smtp.zoho.uk
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        value: support@entraccess-collector.co.uk
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPPORT_EMAIL
        value: support@entraccess-collector.co.uk

  - type: web
    name: entraccess-collector-web
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /api/health
    domains:
      - entraccess-collector.co.uk
      - www.entraccess-collector.co.uk
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: entraccess-collector-api
          property: hostport

databases:
  - name: entraccess-collector-db
    plan: basic-256mb
    region: frankfurt
    databaseName: collector
    postgresMajorVersion: "16"
    ipAllowList: []
