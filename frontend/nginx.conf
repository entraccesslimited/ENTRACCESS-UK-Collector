# Expanded by the nginx image's entrypoint at start: only ${API_UPSTREAM} is
# replaced (nginx's own $variables are left alone, since they are not set in
# the environment). Docker Compose uses the default, api:8000; on Render it is
# the private API service's host:port.

# Behind Render's proxy TLS has already ended, so $scheme is http. Pass on the
# scheme the visitor actually used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # nginx's stock types have no entry for app manifests; served as
    # octet-stream, a browser may refuse the install details.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
